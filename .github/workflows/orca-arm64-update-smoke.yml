name: Orca arm64 native update smoke
on:
  push:
    branches: [hydra/orca-arm64-update-smoke]
permissions:
  contents: read
jobs:
  signed-native-update:
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: /bin/bash smoke.sh
